<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Perpustakaan Jurnal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#8a8176;--ac:#b4562f;--bd:#e6dfd3;--mk:#ffe9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#27241f;--tx:#f0eadf;--mu:#a39a8c;--ac:#e08a60;--bd:#3a352d;--mk:#6b5a1f}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#27241f;--tx:#f0eadf;--mu:#a39a8c;--ac:#e08a60;--bd:#3a352d;--mk:#6b5a1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,'Times New Roman',serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0 .1em}
h2{font:600 .95rem system-ui,sans-serif;color:var(--mu);margin:22px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--mu);margin:0 0 14px;font:.88rem system-ui,sans-serif}
input,select,button{font:.95rem system-ui,sans-serif;color:var(--tx)}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
button,.btn{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px;text-decoration:none;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>*{flex:1 1 130px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 15px;margin:10px 0}
.meta{display:flex;gap:8px;align-items:center;font:.8rem system-ui,sans-serif;color:var(--mu);margin-bottom:4px}
.meta b{color:var(--tx)}
.badge{padding:1px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--ac)}
.txt{white-space:pre-wrap;word-wrap:break-word;font-size:.97rem}
.txt.cl{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{border:0;background:none;color:var(--ac);padding:4px 0;font-size:.85rem}
mark{background:var(--mk);color:inherit;border-radius:3px;padding:0 1px}
.empty,#cnt{color:var(--mu);font:.85rem system-ui,sans-serif}
.empty{text-align:center;padding:26px 0}
.docs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.docs a{font:.82rem system-ui,sans-serif;color:var(--ac)}
#lock{max-width:380px;margin:18vh auto 0;padding:0 16px}#lock .lk{text-align:center}#lock input{text-align:center}
</style>
</head>
<body>
<div id="lock"><div class="lk">
<h1>🔒 Jurnal</h1>
<p class="sub">Masukkan kata sandi untuk membuka.</p>
<input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
<div class="row"><button id="go" type="button" style="background:var(--ac);color:#fff;border-color:var(--ac)">Buka</button></div>
<div id="err" class="empty"></div>
</div></div>
<main id="app" hidden>
<h1>📓 Perpustakaan Jurnal</h1>
<p class="sub">Cari isi jurnal 2025 &amp; 2026, atau lompat ke tanggal tertentu.</p>
<div class="docs" id="docs"></div>

<input id="q" type="search" placeholder="Cari kata di isi jurnal…" autocomplete="off">
<div class="row">
  <input id="dt" type="date">
  <select id="fy"><option value="">Semua tahun</option><option>2025</option><option>2026</option></select>
  <select id="fs"><option value="">Semua bagian</option><option value="harian">Harian</option><option value="syukur">Joy &amp; Grateful</option><option value="belajar">Grow &amp; Learn</option><option value="english">English</option></select>
  <select id="fm"><option value="">Semua bulan</option></select>
</div>
<div class="row"><button id="rnd" type="button">🎲 Acak</button><button id="rst" type="button">Reset</button></div>

<div id="same"></div>
<h2 id="hd"></h2>
<div id="cnt"></div>
<div id="list"></div>
<div class="row"><button id="more" type="button" style="display:none">Tampilkan lebih banyak</button></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
function start(DATA,LINKS){
$('docs').innerHTML=LINKS.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener noreferrer">↗ '+l[0]+'</a>'}).join('');
var MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var SEC={harian:'Harian',syukur:'Joy & Grateful',belajar:'Grow & Learn',english:'English'};
var ORD={harian:0,syukur:1,belajar:2,english:3};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
DATA.forEach(function(e){e.n=e.t.toLowerCase()});
DATA.sort(function(a,b){return b.y-a.y||b.m-a.m||b.d-a.d||ORD[a.s]-ORD[b.s]});
$('fm').innerHTML+=MON.map(function(m,i){return '<option value="'+(i+1)+'">'+m+'</option>'}).join('');
var LIM=30,shown=LIM,cur=[],toks=[];

function label(e){
  if(!e.m)return e.y+' · Kosakata';
  return (e.d?e.d+' ':'')+MON[e.m-1]+' '+e.y;
}
function hl(t){
  if(!toks.length)return esc(t);
  var re=new RegExp('('+toks.map(escRe).join('|')+')','gi');
  return t.split(re).map(function(p,i){return i%2?'<mark>'+esc(p)+'</mark>':esc(p)}).join('');
}
function card(e){
  var long=e.t.length>420&&!toks.length;
  return '<div class="card"><div class="meta"><b>'+esc(label(e))+'</b><span class="badge">'+SEC[e.s]+'</span></div>'+
   '<div class="txt'+(long?' cl':'')+'">'+hl(e.t)+'</div>'+(long?'<button class="more" data-x="1">Selengkapnya</button>':'')+'</div>';
}
function filter(){
  var q=$('q').value.trim().toLowerCase(),y=$('fy').value,s=$('fs').value,m=$('fm').value,dt=$('dt').value;
  toks=q?q.split(/\s+/).filter(Boolean):[];
  var Y=0,M=0,D=0;
  if(dt){var p=dt.split('-');Y=+p[0];M=+p[1];D=+p[2]}
  return DATA.filter(function(e){
    if(y&&e.y!=y)return false;if(s&&e.s!==s)return false;if(m&&e.m!=m)return false;
    if(dt&&!(e.y===Y&&e.m===M&&e.d===D))return false;
    return toks.every(function(w){return e.n.indexOf(w)>=0});
  });
}
function render(){
  cur=filter();
  var active=toks.length||$('fy').value||$('fs').value||$('fm').value||$('dt').value;
  if(!active){
    $('hd').textContent='';$('cnt').textContent='';$('more').style.display='none';
    $('list').innerHTML='<div class="empty">Ketik kata, pilih tanggal, atau pakai filter untuk mulai mencari.</div>';
  }else{
    $('hd').textContent='Hasil';
    $('cnt').textContent=cur.length+' entri'+(toks.length?' cocok':'');
    $('list').innerHTML=cur.length?cur.slice(0,shown).map(card).join(''):'<div class="empty">Tidak ada entri yang cocok.</div>';
    $('more').style.display=cur.length>shown?'':'none';
  }
  // tanggal yang sama di tahun lain
  var dt=$('dt').value,md=null;
  if(dt){var p=dt.split('-');md=[+p[1],+p[2],+p[0]]}
  else if(!active){var n=new Date();md=[n.getMonth()+1,n.getDate(),n.getFullYear()]}
  var same=md?DATA.filter(function(e){return e.m===md[0]&&e.d===md[1]&&e.y!==md[2]&&e.s==='harian'}):[];
  $('same').innerHTML=same.length?'<h2>'+(dt?'Tanggal yang sama di tahun lain':'Hari ini di tahun lalu')+'</h2>'+same.map(card).join(''):'';
}
function go(){shown=LIM;render()}
['q','dt','fy','fs','fm'].forEach(function(i){$(i).addEventListener(i==='q'?'input':'change',go)});
$('rst').onclick=function(){['q','dt','fy','fs','fm'].forEach(function(i){$(i).value=''});go()};
$('more').onclick=function(){shown+=LIM;render()};
$('rnd').onclick=function(){
  var pool=DATA.filter(function(e){return e.s==='harian'});
  var e=pool[Math.floor(Math.random()*pool.length)];
  $('list').innerHTML='<div class="card" style="border-color:var(--ac)">'+card(e).replace(/^<div class="card">/,'')+'';
  $('hd').textContent='Entri acak';$('cnt').textContent='';$('more').style.display='none';$('same').innerHTML='';
};
document.addEventListener('click',function(ev){
  var b=ev.target.closest('.more');if(!b)return;
  var t=b.previousElementSibling;t.classList.toggle('cl');b.textContent=t.classList.contains('cl')?'Selengkapnya':'Ringkas';
});
render();
}
</script>
<script>
(function(){
var BLOB="__BLOB__";
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')}
async function dec(pw){
  var raw=Uint8Array.from(atob(BLOB),function(c){return c.charCodeAt(0)});
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
var busy=false;
async function open(){
  if(busy)return;busy=true;
  var e=document.getElementById('err');e.textContent='Memeriksa…';
  try{
    var p=await dec(document.getElementById('pw').value);
    document.getElementById('lock').hidden=true;document.getElementById('app').hidden=false;
    document.getElementById('pw').value='';
    start(p.entries,p.links);
  }catch(x){e.textContent='Kata sandi salah.'}
  busy=false;
}
document.getElementById('go').onclick=open;
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')open()});
})();
</script>
</body>
</html>
